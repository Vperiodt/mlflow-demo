[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feast-mlflow-demo"
version = "0.1.0"
description = "Feast-native MLflow integration demo (Docker image + feast-patches; no separate pip plugin)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "feast[redis]>=0.35.0",
    "mlflow>=2.10.0",
    "pandas>=1.5.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
demo = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "dask[dataframe]>=2023.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = []
