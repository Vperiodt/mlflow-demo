<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feast + MLflow Lineage</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }
  .header { padding: 24px 32px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .badge { background: #238636; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
  .content { padding: 32px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #58a6ff; }
  .mermaid { background: #0d1117; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat { background: #21262d; border-radius: 8px; padding: 16px; text-align: center; }
  .stat .value { font-size: 28px; font-weight: 700; color: #58a6ff; }
  .stat .label { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .run-table { width: 100%; border-collapse: collapse; }
  .run-table th, .run-table td { text-align: left; padding: 10px 16px; border-bottom: 1px solid #30363d; }
  .run-table th { color: #8b949e; font-size: 12px; text-transform: uppercase; }
  .run-table td a { color: #58a6ff; text-decoration: none; }
  .run-table td a:hover { text-decoration: underline; }
  #error { color: #f85149; padding: 16px; display: none; }
  .loading { text-align: center; padding: 48px; color: #8b949e; }
</style>
</head>
<body>
<div class="header">
  <h1>Feast + MLflow Lineage</h1>
  <span class="badge">Native Integration</span>
</div>

<div class="content">
  <div id="error"></div>
  <div id="loading" class="loading">Loading registry data...</div>

  <div id="stats-card" class="card" style="display:none">
    <h2>Overview</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div id="graph-card" class="card" style="display:none">
    <h2>Lineage Graph</h2>
    <div class="mermaid" id="graph"></div>
  </div>

  <div id="runs-card" class="card" style="display:none">
    <h2>Training Runs</h2>
    <table class="run-table">
      <thead><tr><th>Run ID</th><th>Experiment</th><th>Feature Service</th><th>Features</th><th>MLflow</th></tr></thead>
      <tbody id="runs-body"></tbody>
    </table>
  </div>
</div>

<script>
mermaid.initialize({ theme: 'dark', startOnLoad: false });

const REGISTRY_URL = window.REGISTRY_URL || '/registry';
const MLFLOW_URI = window.MLFLOW_URI || 'http://localhost:5000';

async function loadRegistry() {
  try {
    const res = await fetch(REGISTRY_URL);
    if (!res.ok) throw new Error(`Registry fetch failed: ${res.status}`);

    const contentType = res.headers.get('content-type') || '';
    let data;

    if (contentType.includes('application/json')) {
      data = await res.json();
    } else {
      // Binary protobuf — fall back to the JSON lineage API
      const lineageRes = await fetch('/api/lineage');
      if (lineageRes.ok) {
        data = await lineageRes.json();
      } else {
        throw new Error('Could not load registry data');
      }
    }

    return data;
  } catch (e) {
    throw e;
  }
}

function renderStats(data) {
  const featureServices = data.feature_services || data.featureServices || [];
  const featureViews = data.feature_views || data.featureViews || [];
  const dataSources = data.data_sources || data.dataSources || [];
  const entities = data.entities || [];
  const trainingRuns = data.training_runs || data.trainingRuns || [];

  const statsHtml = [
    { value: featureServices.length, label: 'Feature Services' },
    { value: featureViews.length, label: 'Feature Views' },
    { value: dataSources.length, label: 'Data Sources' },
    { value: entities.length, label: 'Entities' },
    { value: trainingRuns.length, label: 'MLflow Runs' },
  ].map(s => `<div class="stat"><div class="value">${s.value}</div><div class="label">${s.label}</div></div>`).join('');

  document.getElementById('stats').innerHTML = statsHtml;
  document.getElementById('stats-card').style.display = '';
}

function renderGraph(data) {
  const featureServices = data.feature_services || data.featureServices || [];
  const featureViews = data.feature_views || data.featureViews || [];
  const dataSources = data.data_sources || data.dataSources || [];
  const trainingRuns = data.training_runs || data.trainingRuns || [];

  let lines = ['graph LR'];

  dataSources.forEach(ds => {
    const name = ds.spec?.name || ds.name || 'unknown';
    const id = 'ds_' + name.replace(/[^a-zA-Z0-9]/g, '_');
    lines.push(`  ${id}["🗄 ${name}"]`);
  });

  featureViews.forEach(fv => {
    const name = fv.spec?.name || fv.name || 'unknown';
    const id = 'fv_' + name.replace(/[^a-zA-Z0-9]/g, '_');
    lines.push(`  ${id}["📊 ${name}"]`);

    const batchSrc = fv.spec?.batchSource?.name || fv.batchSource?.name;
    if (batchSrc) {
      const srcId = 'ds_' + batchSrc.replace(/[^a-zA-Z0-9]/g, '_');
      lines.push(`  ${srcId} --> ${id}`);
    }
  });

  featureServices.forEach(fs => {
    const name = fs.spec?.name || fs.name || 'unknown';
    const id = 'fs_' + name.replace(/[^a-zA-Z0-9]/g, '_');
    lines.push(`  ${id}["⚡ ${name}"]:::fsClass`);

    const features = fs.spec?.features || fs.features || [];
    features.forEach(f => {
      const fvName = f.featureViewName || f.feature_view_name || '';
      if (fvName) {
        const fvId = 'fv_' + fvName.replace(/[^a-zA-Z0-9]/g, '_');
        lines.push(`  ${fvId} --> ${id}`);
      }
    });
  });

  trainingRuns.forEach(run => {
    const runId = run.run_id || run.runId || '';
    const exp = run.experiment_name || run.experimentName || '';
    const fsName = run.feature_service_name || run.featureServiceName || '';
    const shortId = runId.substring(0, 8);
    const nodeId = 'mlrun_' + shortId;
    const trackingUri = run.tracking_uri || run.trackingUri || MLFLOW_URI;
    lines.push(`  ${nodeId}["⚗ ${exp}:${shortId}"]:::mlClass`);
    lines.push(`  click ${nodeId} "${trackingUri}/#/experiments/1/runs/${runId}" _blank`);

    if (fsName) {
      const fsId = 'fs_' + fsName.replace(/[^a-zA-Z0-9]/g, '_');
      lines.push(`  ${fsId} --> ${nodeId}`);
    }
  });

  lines.push('  classDef fsClass fill:#238636,stroke:#2ea043,color:#fff');
  lines.push('  classDef mlClass fill:#1565c0,stroke:#1976d2,color:#fff');

  const graphDef = lines.join('\n');
  document.getElementById('graph').textContent = graphDef;
  document.getElementById('graph-card').style.display = '';

  mermaid.run({ nodes: [document.getElementById('graph')] });
}

function renderRuns(data) {
  const trainingRuns = data.training_runs || data.trainingRuns || [];
  if (trainingRuns.length === 0) return;

  const rows = trainingRuns.map(run => {
    const runId = run.run_id || run.runId || '';
    const exp = run.experiment_name || run.experimentName || '';
    const fs = run.feature_service_name || run.featureServiceName || '';
    const refs = run.feature_refs || run.featureRefs || [];
    const uri = run.tracking_uri || run.trackingUri || MLFLOW_URI;
    return `<tr>
      <td><code>${runId.substring(0, 12)}...</code></td>
      <td>${exp}</td>
      <td>${fs}</td>
      <td>${refs.length} features</td>
      <td><a href="${uri}/#/experiments/1/runs/${runId}" target="_blank">Open in MLflow →</a></td>
    </tr>`;
  }).join('');

  document.getElementById('runs-body').innerHTML = rows;
  document.getElementById('runs-card').style.display = '';
}

async function init() {
  try {
    const data = await loadRegistry();
    document.getElementById('loading').style.display = 'none';
    renderStats(data);
    renderGraph(data);
    renderRuns(data);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = '';
    document.getElementById('error').textContent = 'Error loading registry: ' + e.message;
  }
}

init();
</script>
</body>
</html>
