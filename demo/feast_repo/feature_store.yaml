# Used by LOCAL machine (train.py, app.py). Talks to Feast servers via localhost ports.
project: fraud_detection
provider: local

registry:
  registry_type: remote
  path: localhost:6570

offline_store:
  type: remote
  host: localhost
  port: 8815

online_store:
  type: remote
  path: http://localhost:6566

entity_key_serialization_version: 3

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  auto_log: true
  lineage: true
